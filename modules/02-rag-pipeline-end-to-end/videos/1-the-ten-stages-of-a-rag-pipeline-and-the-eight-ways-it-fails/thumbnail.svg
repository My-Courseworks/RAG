<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>The Ten Stages of a RAG Pipeline: 9 of 10 stages worked, the answer was still wrong</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a5e"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowA)"/>
  <rect width="1280" height="720" fill="url(#glowB)"/>

  <!-- headline -->
  <text x="64" y="120" fill="#fbbf24" font-size="30" font-weight="800" letter-spacing="5">RAG EXPLAINED · MODULE 2</text>
  <text x="64" y="232" fill="#ffffff" font-size="112" font-weight="900" letter-spacing="-2">10 Stages.</text>
  <text x="64" y="346" fill="#ffffff" font-size="112" font-weight="900" letter-spacing="-2">1 Wrong</text>
  <text x="64" y="460" fill="#fb7185" font-size="112" font-weight="900" letter-spacing="-2">Answer.</text>
  <rect x="64" y="478" width="388" height="10" rx="5" fill="#fb7185" opacity="0.9"/>

  <text x="64" y="552" fill="#c7d4f2" font-size="38" font-weight="600">Learn to find where your AI</text>
  <text x="64" y="598" fill="#c7d4f2" font-size="38" font-weight="600">pipeline really breaks.</text>

  <!-- answer card -->
  <g transform="rotate(4 930 230) translate(-20 -10)" filter="url(#shadow)">
    <rect x="720" y="92" width="420" height="300" rx="30" fill="#0b2a22" stroke="#34d399" stroke-width="6"/>
    <text x="756" y="148" fill="#34d399" font-size="26" font-weight="800" letter-spacing="3">AI ANSWER</text>
    <text x="930" y="300" fill="#34d399" font-size="150" font-weight="900" text-anchor="middle">€0</text>
    <text x="930" y="350" fill="#8fe3c0" font-size="24" font-weight="600" text-anchor="middle">confident · cited</text>
  </g>
  <!-- wrong stamp -->
  <g transform="rotate(-10 1060 440)" filter="url(#shadow)">
    <rect x="930" y="402" width="290" height="80" rx="18" fill="#fb7185"/>
    <text x="1075" y="460" fill="#2c0f17" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="3">WRONG</text>
  </g>

  <!-- pipeline strip -->
  <g transform="translate(0 0)">
    <rect x="600" y="520" width="616" height="140" rx="70" fill="#0a1020" opacity="0.75" stroke="#22334f" stroke-width="2"/>
    <g font-size="26" font-weight="900" text-anchor="middle">
      <circle cx="656" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="656" y="583" fill="#34d399">1</text>
      <circle cx="710" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="710" y="583" fill="#34d399">2</text>
      <circle cx="764" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="764" y="583" fill="#34d399">3</text>
      <circle cx="818" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="818" y="583" fill="#34d399">4</text>
      <circle cx="872" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="872" y="583" fill="#34d399">5</text>
      <circle cx="926" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="926" y="583" fill="#34d399">6</text>
      <circle cx="980" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="980" y="583" fill="#34d399">7</text>
      <circle cx="1034" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="1034" y="583" fill="#34d399">8</text>
      <circle cx="1088" cy="574" r="25" fill="#07251d" stroke="#34d399" stroke-width="4"/><text x="1088" y="583" fill="#34d399">9</text>
      <circle cx="1160" cy="574" r="34" fill="#2c0f17" stroke="#fb7185" stroke-width="5" filter="url(#soft)"/>
      <path d="M1145 545 L1175 575 M1175 545 L1145 575" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="908" y="640" fill="#93a7c8" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">9 OF 10 STAGES WORKED</text>
  </g>

  <!-- corner sticker -->
  <g transform="rotate(-6 1180 70)">
    <rect x="1070" y="22" width="170" height="56" rx="28" fill="#fbbf24"/>
    <text x="1155" y="60" fill="#2a1e07" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="2">BEGINNER</text>
  </g>
</svg>
